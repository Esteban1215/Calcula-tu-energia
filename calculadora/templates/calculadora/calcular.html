{% extends "base.html" %}

{% block title %}Calculadora{% endblock %}

{% block content %}
<div class="card shadow p-4">

    <h2 class="mb-4">Calculadora de Energía</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary mt-2">Calcular</button>
    </form>

    {% if resultado %}
        <div class="alert alert-success mt-4">
            <h4>Resultado:</h4>
            <p>Gasto aproximado: <strong>${{ resultado }}</strong></p>
        </div>
    {% endif %}
</div>
{% endblock %}
