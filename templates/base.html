<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Calcula tu Energía{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <canvas id="particles-canvas"></canvas>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container d-flex justify-content-between">

            <!-- Logo -->
            <a class="navbar-brand" href="/">Calcula tu Energía</a>

            <!-- Botones de navegación -->
            <div class="d-flex gap-2">

                <!-- Enlaces principales -->
                <a class="btn btn-outline-light btn-sm" href="/calculadora/">Calculadora</a>
                <a class="btn btn-outline-light btn-sm" href="/historial/">Historial</a>
                <a class="btn btn-outline-light btn-sm" href="/historial/graficas/">Gráficas</a>

                <!-- Botones de usuario -->
                {% if user.is_authenticated %}
                <span class="text-white align-self-center me-2">
                    Hola, {{ user.username }}
                </span>
                <a class="btn btn-danger btn-sm" href="/usuarios/logout/">Cerrar sesión</a>
                {% else %}
                <a class="btn btn-success btn-sm" href="/usuarios/login/">Ingresar</a>
                <a class="btn btn-primary btn-sm" href="/usuarios/registro/">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="{% static 'js/particles.js' %}"></script>
</body>

</html>
