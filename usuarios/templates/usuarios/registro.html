{% extends "base.html" %}

{% block title %}Registro{% endblock %}

{% block content %}
<div class="card p-4 shadow" style="max-width: 450px; margin: auto;">
    <h3 class="mb-3 text-center">Crear Cuenta</h3>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success w-100 mt-2">Registrarse</button>
    </form>

    <div class="text-center mt-3">
        <a href="{% url 'login' %}">Ya tengo cuenta</a>
    </div>
</div>
{% endblock %}
