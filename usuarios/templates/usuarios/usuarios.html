{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="card p-4 shadow" style="max-width: 450px; margin: auto;">
    <h3 class="mb-3 text-center">Iniciar Sesión</h3>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100 mt-2">Ingresar</button>
    </form>

    <div class="text-center mt-3">
        <a href="{% url 'registro' %}">Crear una cuenta</a>
    </div>
</div>
{% endblock %}
